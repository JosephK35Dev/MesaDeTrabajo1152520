<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de ayuda</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="app.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100">

  <header class="bg-slate-800 px-4 py-6 text-white">
    <div class="mx-auto max-w-6xl">
      <h1 class="text-3xl font-bold">Mesa de ayuda</h1>
      <p class="mt-1 text-slate-300">Tickets de soporte de la oficina</p>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-6 lg:grid-cols-3">

    <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
    <section class="rounded-lg bg-white p-6 shadow lg:col-span-1">
      <h2 id="titulo-formulario" class="mb-4 text-xl font-bold">
        Nuevo ticket
      </h2>

      <form id="form-ticket" class="space-y-4" novalidate>

        <div>
          <label for="titulo" class="mb-1 block font-medium">
            Título
          </label>
          <input
            id="titulo"
            name="titulo"
            type="text"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
          <p id="error-titulo" class="text-sm text-red-600"></p>
        </div>

        <div>
          <label for="descripcion" class="mb-1 block font-medium">
            Descripción
          </label>
          <textarea
            id="descripcion"
            name="descripcion"
            rows="3"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          ></textarea>
        </div>

        <div>
          <label for="solicitante" class="mb-1 block font-medium">
            Solicitante
          </label>
          <input
            id="solicitante"
            name="solicitante"
            type="text"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
          <p id="error-solicitante" class="text-sm text-red-600"></p>
        </div>

        <div>
          <label for="categoria" class="mb-1 block font-medium">
            Categoría
          </label>
          <select
            id="categoria"
            name="categoria"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
            <option value="hardware">Hardware</option>
            <option value="software">Software</option>
            <option value="red">Red</option>
            <option value="accesos">Accesos</option>
          </select>
        </div>

        <div>
          <label for="prioridad" class="mb-1 block font-medium">
            Prioridad
          </label>
          <select
            id="prioridad"
            name="prioridad"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div class="flex gap-2">
          <button
            id="btn-guardar"
            type="submit"
            class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
          >
            Crear ticket
          </button>

          <button
            id="btn-cancelar"
            type="button"
            hidden
            class="rounded bg-slate-200 px-4 py-2 hover:bg-slate-300"
          >
            Cancelar edición
          </button>
        </div>

      </form>
    </section>

    <!-- Tablero -->
    <section class="rounded-lg bg-white p-6 shadow lg:col-span-2">
      <h2 class="mb-4 text-xl font-bold">Tickets</h2>

      <div
        id="resumen"
        class="mb-4"
      ></div>

      <div class="mb-4 flex flex-col gap-3 md:flex-row">

        <div>
          <label for="filtro-estado" class="mr-2 font-medium">
            Estado
          </label>

          <select
            id="filtro-estado"
            class="rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
            <option value="todos">Todos</option>
            <option value="abierto">Abiertos</option>
            <option value="en_progreso">En progreso</option>
            <option value="resuelto">Resueltos</option>
          </select>
        </div>

        <div class="flex-1">
          <label for="busqueda" class="mr-2 font-medium">
            Buscar
          </label>

          <input
            id="busqueda"
            type="search"
            placeholder="Buscar por título"
            class="w-full rounded border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
          >
        </div>

      </div>

      <p id="mensaje" class="mb-4"></p>

      <div
        id="lista-tickets"
        class="grid grid-cols-1 gap-4 md:grid-cols-2"
      ></div>
    </section>

  </main>

</body>
</html>
